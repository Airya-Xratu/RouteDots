name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: 'Run e2e (debug: report tail to PR comment)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test:e2e > /tmp/e2e-full.txt 2>&1
          CODE=$?
          set -e
          PR=$(gh pr view --json number -q .number || echo 12)
          {
            echo "e2e exit code: ${CODE}"
            echo '```'
            tail -80 /tmp/e2e-full.txt
            echo '```'
          } > /tmp/pr-note.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$(cat /tmp/pr-note.md)"
          exit $CODE
