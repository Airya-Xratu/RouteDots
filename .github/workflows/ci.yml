name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: 'Run e2e (debug: commit output to branch)'
        run: |
          set -e
          npm run test:e2e > /tmp/e2e-full.txt 2>&1 || CODE=$?
          CODE=${CODE:-0}
          {
            echo "e2e exit code: ${CODE}"
            echo '```'
            cat /tmp/e2e-full.txt
            echo '```'
          } > e2e-debug-output.md
          # Push the debug file to the branch only if it is not there yet,
          # so follow-up CI runs do not loop.
          if [ ! -f e2e-debug-output-pushed.marker ]; then
            git config user.name "ci-debug"
            git config user.email "ci-debug@users.noreply.github.com"
            touch e2e-debug-output-pushed.marker
            git add e2e-debug-output.md e2e-debug-output-pushed.marker
            git commit -m "chore(ci): temporary e2e debug output"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || echo "DEBUG PUSH FAILED"
          fi
          exit "${CODE}"
