<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RouteDots E2E fixture — camera tracking</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #globe {
        position: fixed;
        inset: 0;
        background: #eef1f5;
      }
    </style>
  </head>
  <body>
    <div id="globe"></div>
    <script src="../../dist/routedots.browser.global.js"></script>
    <script>
      window.__state = { ready: false, error: null, webgl: null };
      try {
        const { RouteDots, supportsWebGL } = window.RouteDots;
        window.__state.webgl = supportsWebGL();
        const rd = new RouteDots(document.getElementById('globe'), {
          theme: 'light',
          autoRotate: { enabled: true, speed: 0.5 },
          plane: { flightMs: 3000, pauseMs: 300 },
        });
        window.__rd = rd;
        window.__state.ready = true;
      } catch (err) {
        window.__state.error = String((err && err.message) || err);
      }
    </script>
  </body>
</html>
